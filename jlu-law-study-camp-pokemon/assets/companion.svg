<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" shape-rendering="crispEdges">
  <g fill="none">
    <!-- Ears (tipped dark navy/slate with golden inner) -->
    <rect x="34" y="14" width="14" height="14" fill="#1e293b"/>
    <rect x="40" y="24" width="16" height="18" fill="#facc15"/>
    <rect x="44" y="28" width="8" height="10" fill="#fde047"/>
    <rect x="112" y="14" width="14" height="14" fill="#1e293b"/>
    <rect x="104" y="24" width="16" height="18" fill="#facc15"/>
    <rect x="108" y="28" width="8" height="10" fill="#fde047"/>
    <!-- Little leaf sprout on top (律芽) -->
    <rect x="76" y="16" width="8" height="18" fill="#16a34a"/>
    <rect x="64" y="12" width="16" height="10" fill="#22c55e"/>
    <rect x="82" y="10" width="16" height="10" fill="#4ade80"/>

    <!-- Head outline & golden body -->
    <rect x="44" y="34" width="72" height="10" fill="#1e293b"/>
    <rect x="36" y="44" width="88" height="54" fill="#1e293b"/>
    <rect x="44" y="42" width="72" height="52" fill="#facc15"/>
    <rect x="52" y="38" width="56" height="8" fill="#fde047"/>

    <!-- Expressive Pokemon Eyes -->
    <rect x="50" y="54" width="14" height="16" fill="#1e293b"/>
    <rect x="96" y="54" width="14" height="16" fill="#1e293b"/>
    <rect x="53" y="56" width="5" height="6" fill="#ffffff"/>
    <rect x="99" y="56" width="5" height="6" fill="#ffffff"/>
    <rect x="59" y="64" width="3" height="3" fill="#ffffff"/>
    <rect x="105" y="64" width="3" height="3" fill="#ffffff"/>

    <!-- Rosy Electric/Fire Cheeks -->
    <rect x="42" y="72" width="12" height="10" fill="#ef4444"/>
    <rect x="106" y="72" width="12" height="10" fill="#ef4444"/>

    <!-- Cute Smile -->
    <rect x="72" y="74" width="16" height="4" fill="#1e293b"/>
    <rect x="76" y="78" width="8" height="4" fill="#ef4444"/>

    <!-- Body & Trainer Scarf with Pokeball Clasp -->
    <rect x="42" y="96" width="76" height="36" fill="#1e293b"/>
    <rect x="48" y="98" width="64" height="30" fill="#facc15"/>
    <!-- Red Scarf -->
    <rect x="46" y="94" width="68" height="12" fill="#dc2626"/>
    <!-- Mini Pokeball Clasp -->
    <rect x="72" y="96" width="16" height="8" fill="#ef4444"/>
    <rect x="72" y="104" width="16" height="8" fill="#ffffff"/>
    <rect x="72" y="102" width="16" height="4" fill="#1e293b"/>
    <rect x="77" y="101" width="6" height="6" fill="#ffffff"/>

    <!-- Arms -->
    <rect x="30" y="102" width="16" height="18" fill="#1e293b"/>
    <rect x="34" y="104" width="12" height="14" fill="#facc15"/>
    <rect x="114" y="102" width="16" height="18" fill="#1e293b"/>
    <rect x="114" y="104" width="12" height="14" fill="#facc15"/>

    <!-- Lightning Tail -->
    <rect x="122" y="108" width="14" height="10" fill="#1e293b"/>
    <rect x="128" y="96" width="14" height="14" fill="#facc15"/>
    <rect x="134" y="82" width="18" height="16" fill="#fde047"/>

    <!-- Feet -->
    <rect x="52" y="132" width="20" height="12" fill="#1e293b"/>
    <rect x="88" y="132" width="20" height="12" fill="#1e293b"/>
    <rect x="48" y="138" width="24" height="8" fill="#b45309"/>
    <rect x="88" y="138" width="24" height="8" fill="#b45309"/>
  </g>
</svg>
